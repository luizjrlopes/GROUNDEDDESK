[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundeddesk-api"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]==0.140.7",
  "SQLAlchemy==2.0.51",
  "psycopg[binary]>=3.2,<4",
  "pgvector==0.5.0",
  "pydantic-settings>=2.14,<3",
  "PyJWT>=2.10,<3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
